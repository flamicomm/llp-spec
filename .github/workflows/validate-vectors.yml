name: Validate Vectors

on:
  push:
    branches: [main]
    paths:
      - '**.json'
      - 'schema/**'
      - 'interoperability/**'
      - 'validate_vectors.py'
      - '.github/workflows/validate-vectors.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.json'
      - 'schema/**'
      - 'interoperability/**'
      - 'validate_vectors.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema

      - name: Validate vector schema
        run: |
          python -c "
          import json, jsonschema, os, sys
          with open('schema/vector.schema.json') as f:
              schema = json.load(f)
          errors = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root: continue
              for fn in files:
                  if not fn.endswith('.json'): continue
                  if fn == 'vector.schema.json': continue
                  with open(os.path.join(root, fn)) as f:
                      data = json.load(f)
                  try:
                      jsonschema.validate(data, schema)
                  except jsonschema.ValidationError as e:
                      errors += 1
                      print(f'{os.path.join(root, fn)}: {e.message}')
          if errors:
              sys.exit(1)
          print('All vector files valid against schema')
          "

      - name: Run reference runner validation
        run: python validate_vectors.py
