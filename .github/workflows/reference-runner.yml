name: Reference Runner

on:
  push:
    branches: [main, dev]
    paths:
      - 'reference/**'
      - 'interoperability/**'
      - 'tools/check_vendor.py'
      - 'tools/selftest_reference.py'
      - 'tools/validate_vectors.py'
      - 'vectors/**'
      - '.github/workflows/reference-runner.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'reference/**'
      - 'interoperability/**'
      - 'tools/check_vendor.py'
      - 'tools/selftest_reference.py'
      - 'tools/validate_vectors.py'
      - 'vectors/**'
      - '.github/workflows/reference-runner.yml'
  workflow_dispatch:

jobs:
  reference:
    name: Reference on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Vendored reference matches its pinned hash
        run: python3 tools/check_vendor.py

      - name: Reference matches the specification examples
        run: python3 tools/selftest_reference.py

      - name: Conformance run
        run: python3 tools/validate_vectors.py
