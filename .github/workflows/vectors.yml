name: Vectors

on:
  push:
    branches: [main]
    paths:
      - 'vectors/**'
      - 'schema/**'
      - 'tools/**'
      - 'reference/**'
      - 'interoperability/**'
      - 'README.md'
      - '.github/workflows/vectors.yml'
  pull_request:
    branches: [main]
    paths:
      - 'vectors/**'
      - 'schema/**'
      - 'tools/**'
      - 'reference/**'
      - 'interoperability/**'
      - 'README.md'
      - '.github/workflows/vectors.yml'
  workflow_dispatch:

jobs:
  corpus:
    name: Corpus is generated, valid and green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema

      - name: Schema validation
        run: python3 tools/check_schema.py

      - name: Corpus, manifest and README table are up to date
        run: |
          python3 tools/build_vectors.py --check
          python3 tools/build_vectors.py --check-readme

      - name: Conformance run
        run: python3 tools/validate_vectors.py --strict

      - name: Fuzz seeds are up to date
        run: python3 tools/generate_fuzz_seeds.py --check
